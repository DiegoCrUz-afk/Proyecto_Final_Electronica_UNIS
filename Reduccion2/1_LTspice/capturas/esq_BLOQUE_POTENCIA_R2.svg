<text x="-80" y="-178" font-size="16" fill="#555" text-anchor="start" font-family="Consolas,monospace">REDUCCION 2 - POTENCIA (5 V)</text>
<text x="-80" y="-148" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">m (permiso) abre el IRLZ44N. El motor lleva SIEMPRE Rs en serie; con n = 1 el 2N3904 (Qp) puentea a Rs y el motor corre normal.</text>
<text x="-80" y="-130" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Con objeto n = 0: Qp se abre y el motor queda con Rs en serie (mas lento). Rs se ajusta por prueba (40 a 60 %). PROPUESTA NO VERIFICADA con el motor real.</text>
<text x="1330" y="-78" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Cin (entrada de 5 V)</text>
<text x="-80" y="312" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">El motor va entre v5 (M+) y dm (M-). Los condensadores Cb y C2 van cerca del motor.</text>
<text x="-80" y="332" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Rs = 15 ohm sale de la simulacion con un motor SUPUESTO (12 ohm, 3 mH): 10 ohm daba 66 %, 15 ohm da 50 %. Con el motor real hay que reajustar.</text>
<text x="-80" y="352" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">IRLZ44N = MOSFET de nivel logico (modelo propio aproximado). Arranque: ~390 mA pico &gt; 200 mA del 2N3904 (ver informe de simulacion).</text>
</svg>