<text x="-180" y="-138" font-size="16" fill="#555" text-anchor="start" font-family="Consolas,monospace">BLOQUE 2 - SENSOR OPTICO IR</text>
<text x="-180" y="-108" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">El fototransistor (TCRT5000) inyecta su corriente en el nodo b. Q2 (emisor comun) la amplifica.</text>
<text x="-180" y="-90" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">El comparador (con histeresis por Rh) pone p = 1 cuando hay objeto.</text>
<text x="-190" y="422" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">LED infrarrojo (~14 mA)</text>
<text x="510" y="280" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">trimpot 10k</text>
<text x="720" y="102" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">histeresis</text>
<text x="590" y="32" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">pull-up</text>
<text x="-190" y="492" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Sin objeto: ~2 uA -&gt; c queda en ~4.2 V (sobre el umbral) y p = 0. Con objeto: ~50 uA -&gt; c baja a ~2.9 V y p = 1.</text>
<text x="-190" y="512" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Ganancia de Q2 = -Rc / (re + RE) = -680 / (14 + 150) = -4. El trimpot mueve el umbral entre 2.9 V y 3.9 V.</text>
<text x="-100" y="772" font-size="12" fill="#0a3d91" text-anchor="start" font-family="Consolas,monospace">.param kir=0.55</text>
