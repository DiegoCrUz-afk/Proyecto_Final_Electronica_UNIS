<text x="-120" y="-68" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Cuando f = 1 (falla enclavada), Q6 conduce como interruptor y enciende el buzzer de 12 V</text>
<text x="-120" y="-50" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">(en la simulacion el buzzer se representa con Rbz de 400 ohm). El LED indica la falla con luz.</text>
<text x="176" y="12" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">buzzer activo 12 V (~30 mA)</text>
<text x="-110" y="162" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">LED rojo (~8 mA)</text>
<text x="-120" y="232" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Ib = (4.9 - 0.7 V) / 1k = 4 mA. Ic = 30 mA. Ic/Ib = 7.5, menor que hFE: el transistor trabaja saturado, como interruptor.</text>
