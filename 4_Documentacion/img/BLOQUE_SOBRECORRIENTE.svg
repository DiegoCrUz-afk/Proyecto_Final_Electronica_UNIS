<text x="-80" y="-148" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">La caida en el shunt (0.47 ohm, nodo sh) la amplifica el LM358: ganancia 1 + Rf/Rg = 7.8.</text>
<text x="-80" y="-130" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">D1 y Cpk guardan el pico; Rd y Cd retrasan ~0.1 s (ignora el arranque); el comparador baja setn si hay falla.</text>
<text x="810" y="328" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">trimpot 10k</text>
<text x="-80" y="572" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Corriente de disparo ~ (Vref + 0.6 V) / (0.47 ohm x 7.8). Con Vref = 2 V: ~0.7 A. El trimpot Rp ajusta Vref.</text>
<text x="-80" y="592" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Cd = 10 uF con Rd = 10k da ~0.1 s de retardo: el arranque del motor (~30 ms) no dispara, una sobrecarga sostenida si.</text>
