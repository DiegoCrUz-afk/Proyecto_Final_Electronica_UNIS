<text x="-160" y="-88" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Rt y el trimpot Rp1 fijan la referencia normal (~0.53 V).</text>
<text x="-160" y="-70" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Si l = 1, Q5 conecta Rp2 y baja vref a la mitad (velocidad reducida).</text>
<text x="-160" y="342" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Rp1 y Rp2 son dos trimpots de 10k (normal y reducida): en la simulacion kvn y kvr indican la posicion del cursor.</text>
<text x="-160" y="362" font-size="12" fill="#555" text-anchor="start" font-family="Consolas,monospace">Reducida = 50 % de la normal (el enunciado pide entre 40 % y 60 %).</text>
